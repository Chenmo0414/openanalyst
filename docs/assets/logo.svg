<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- OpenAnalyst mark: three bars and a rising line inside a rounded tile.
       Brand blue #2a78d6 = categorical slot 1 of the validated palette. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#1c5cab"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- bars, 4px-radius data ends, square at the baseline -->
  <path d="M30 96 v-26 a4 4 0 0 1 4-4 h8 a4 4 0 0 1 4 4 v26 z" fill="#ffffff" opacity=".55"/>
  <path d="M56 96 v-42 a4 4 0 0 1 4-4 h8 a4 4 0 0 1 4 4 v42 z" fill="#ffffff" opacity=".75"/>
  <path d="M82 96 v-58 a4 4 0 0 1 4-4 h8 a4 4 0 0 1 4 4 v58 z" fill="#ffffff"/>
  <!-- rising line with end markers -->
  <path d="M28 62 L54 44 L78 52 L100 26" fill="none" stroke="#cde2fb" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="26" r="7" fill="#cde2fb" stroke="#1c5cab" stroke-width="3"/>
</svg>
